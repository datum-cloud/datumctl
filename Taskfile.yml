version: '3'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build datumctl locally with go (Go stamps a pseudo-version such as v0.23.4-0.<date>-<sha> after the last tag)
    vars:
      GIT_COMMIT:
        sh: git rev-parse HEAD
    cmds:
      - go build -ldflags "-X k8s.io/component-base/version.gitCommit={{.GIT_COMMIT}}" -o datumctl .

  nix-update-hash:
    desc: Automatically update the vendorHash in flake.nix after Go dependency changes
    cmds:
      - go run scripts/update-nix-hash.go

  nix-build:
    desc: Build the project with Nix
    cmds:
      # `nix build` only sees files git knows about (even untracked ones must be
      # staged), so write `git describe` to a VERSION file and stage it with
      # intent-to-add; flake.nix reads it to embed the same pseudo-version
      # `go build` would. --dirty is captured before VERSION exists, since
      # staging it makes nix see the tree as dirty. Cleaned up afterwards so
      # it's never actually committed.
      - defer: git reset -- VERSION && rm -f VERSION
      - git describe --tags --long --dirty > VERSION || true
      - git add -N VERSION
      - nix build

  nix-dev:
    desc: Enter the Nix development shell
    cmds:
      - nix develop

  nix-fmt:
    desc: Format nix files
    cmds:
      - nix fmt

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf result result-*

  nix-check:
    desc: Check flake syntax and run checks
    cmds:
      - nix flake check

  notice:
    desc: Regenerate the NOTICE file of third-party licenses
    cmds:
      - ./scripts/licenses/notice.sh
